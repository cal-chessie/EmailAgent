# Nginx reverse proxy config for Solar Agent dashboard
# Place in /etc/nginx/sites-available/solar-agent
# Symlink: sudo ln -s /etc/nginx/sites-available/solar-agent /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name solar-agent.yourdomain.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name solar-agent.yourdomain.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/solar-agent.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solar-agent.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/solar-agent/access.log;
    error_log /var/log/solar-agent/error.log;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=solar_limit:10m rate=10r/s;

    location / {
        # Apply rate limit
        limit_req zone=solar_limit burst=20 nodelay;

        # Proxy to dashboard
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        # Health endpoint — no rate limiting
        limit_req zone=solar_limit burst=50 nodelay;
    }
}